name: Build installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: pwsh
        run: |
          $env:PATH = "C:\Program Files (x86)\Inno Setup 6;C:\Program Files\7-Zip;$env:PATH"
          powershell -ExecutionPolicy Bypass -File packaging\build.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Midframe-Setup
          path: dist/*
          compression-level: 0

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: |
            Download **every** file below (`Midframe-Setup.exe` and the `.bin` slices) into one folder, then run the setup.
