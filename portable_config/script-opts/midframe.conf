enabled=yes
# show the setup sheet (quality + frame rate) before each video starts; per-kind choices are remembered in midframe-prefs.json
ask=yes
# defaults for the prompts; the last answer is remembered in midframe-prefs.json
# choice: x1.5 / x2 / x2.5 / x3 or a number like 60; quality: auto / 2160 / 1440 / 1080 / 720 / 480
choice=x2
quality=auto
# hold repeated anime drawings instead of interpolating them
anime=yes
