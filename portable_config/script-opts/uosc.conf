# Bottom bar: open | subtitles, audio, quality | FPS (badge = output fps), debug | playlist | fullscreen
controls=command:folder_open:script-binding uosc/open-file?Open file (Ctrl+O),gap,<has_sub>subtitles,<has_many_audio>audio,<stream>stream-quality,gap,space,button:framegen_fps,button:framegen_debug,gap,<has_playlist>prev,<has_playlist>items,<has_playlist>next,gap,fullscreen
stream_quality_options=2160,1440,1080,720,480
# Top bar: title plus FrameGen's status line (resolution, source → output fps, RIFE model)
top_bar=always
top_bar_alt_title=${user-data/framegen/status}
top_bar_alt_title_place=below
# FrameGen draws its own start screen
disable_elements=idle_indicator
# Theme (matches the Figma design)
color=foreground=8b6cff,foreground_text=ffffff,background=14161b,background_text=f2f4f7,curtain=07080a,success=3ddc97,error=ff5c6c
border_radius=10
menu_min_width=300
