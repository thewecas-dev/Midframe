# Bottom bar (left → right): play/pause, back 10 s, forward 10 s | quality, frame rate, subtitles, debug, settings, fullscreen
controls=button:midframe_play,command:replay_10:seek -10?Back 10 s,command:forward_10:seek 10?Forward 10 s,gap,space,button:midframe_quality,button:midframe_fps,<has_sub>subtitles,button:midframe_debug,button:midframe_settings,fullscreen
# Thin line timeline with chapter ticks, time on the left
timeline_style=line
timeline_line_width=4
timeline_size=24
timeline_persistency=paused
time_precision=0
progress=never
# Top bar: Midframe's status line (title · resolution · source → output fps · RIFE model); uosc's own title is off
# so nothing sits over the home screen while idle
top_bar=always
top_bar_title=no
top_bar_alt_title=${user-data/midframe/status}
top_bar_alt_title_place=below
top_bar_controls=no
# Midframe draws its own start screen and menus
disable_elements=idle_indicator
# Theme (Figma tokens)
color=foreground=8b6cff,foreground_text=ffffff,background=15151b,background_text=f3f2f7,curtain=0c0c10,success=4ade80,error=f87171
border_radius=10
font_scale=0.95
