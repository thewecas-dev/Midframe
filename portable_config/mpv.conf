# Midframe player defaults
title=${?media-title:${media-title} – }Midframe
vo=gpu-next
# RIFE needs frames in system memory
hwdec=auto-copy
video-sync=display-resample
# RIFE does the interpolation, not mpv
interpolation=no
# drops are counted and feed auto mode
framedrop=vo
keep-open=yes
# uosc replaces the built-in controls
osc=no
osd-bar=no
# Auto quality: picked once at load. Use the quality menu for anything else.
# ponytail: fixed 1440p cap; learn it from auto-mode results if 4K proves fine.
ytdl-format=bestvideo[height<=?1440]+bestaudio/best
# YouTube: load every format as a track so the setup sheet can list and switch qualities without a reload
script-opts-append=ytdl_hook-all_formats=yes
# Command pipe for automation and remote diagnostics (mpv IPC)
input-ipc-server=\\.\pipe\midframe
# Open a window with the start screen when launched without a file; start at the design size, capped to the screen
idle=yes
force-window=yes
geometry=1440x900
autofit-larger=92%x90%
